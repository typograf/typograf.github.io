<script>
    (() => {
        let themePreference = 'system';
        try {
            themePreference = JSON.parse(localStorage.getItem('settings.theme') || '"system"');
        } catch {}
        const systemDark = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches;
        const darkTheme = themePreference === 'dark' || (themePreference !== 'light' && systemDark);
        document.documentElement.dataset.theme = darkTheme ? 'dark' : 'light';
        document.documentElement.dataset.tab = location.hash === '#!about' ? 'about' : location.hash === '#!prefs' ? 'prefs' : 'editor';
        document.querySelector('meta[name="theme-color"]').content = darkTheme ? '#1d5e70' : '#00acc7';
    })();
</script>
